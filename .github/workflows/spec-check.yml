name: spec-check

# Fails a PR unless its Spec section is either checked "Not required",
# or links a spec in docs/specs/ whose file contains an approval line.
# The PR body is passed through env, never interpolated into the script.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Spec section
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s\n' "$BODY" | grep -q -E '^- \[x\] Not required'; then
            echo "Spec marked not required. Passing."
            exit 0
          fi
          if ! printf '%s\n' "$BODY" | grep -q -E '^- \[x\] Spec linked'; then
            echo "::error::Check either 'Spec linked, approved' or 'Not required' in the Spec section."
            exit 1
          fi
          printf '%s\n' "$BODY" | grep -o -E 'docs/specs/[A-Za-z0-9._-]+\.md' | sort -u > "$RUNNER_TEMP/specs.txt" || true
          if [ ! -s "$RUNNER_TEMP/specs.txt" ]; then
            echo "::error::The Spec section has no link to docs/specs/<slug>.md. Link the spec file, or check 'Not required'."
            exit 1
          fi
          echo "Spec links found:"; cat "$RUNNER_TEMP/specs.txt"
          echo "SPEC_LIST=$RUNNER_TEMP/specs.txt" >> "$GITHUB_ENV"

      - name: Check the spec has an approval line
        if: ${{ github.event.pull_request.body != '' && !contains(github.event.pull_request.body, 'Not required') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify approval in each linked spec
        if: ${{ github.event.pull_request.body != '' && !contains(github.event.pull_request.body, 'Not required') }}
        run: |
          set -euo pipefail
          status=0
          while read -r spec; do
            if [ ! -f "$spec" ]; then
              echo "::error file=$spec::Linked spec does not exist in this PR's head."
              status=1
              continue
            fi
            if ! grep -q -E '^Approved by: .+, [0-9]{4}-[0-9]{2}-[0-9]{2}' "$spec"; then
              echo "::error file=$spec::No 'Approved by: <name>, <YYYY-MM-DD>' line. Owner approval is required before code."
              status=1
            fi
          done < "$SPEC_LIST"
          exit $status
